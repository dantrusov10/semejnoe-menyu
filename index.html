<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3a56" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Семейная кухня</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;650;750&family=Syne:wght@700;750&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet" />
  <link href="app/css/app.css" rel="stylesheet" />
</head>
<body>
  <div class="sk-layout">
    <aside class="sk-side" id="side-nav">
      <div class="sk-side-brand">
        <span>Богданиха</span>
        Семейная кухня
      </div>
      <nav class="sk-side-nav" id="nav-list" aria-label="Разделы">
        <button type="button" data-screen="today" class="active">Сегодня</button>
        <button type="button" data-screen="plan">План</button>
        <button type="button" data-screen="period">Период</button>
        <button type="button" data-screen="inventory">Запасы</button>
        <button type="button" data-screen="basket">Покупки</button>
        <button type="button" data-screen="recipes">Рецепты</button>
        <button type="button" data-screen="stats">Статистика</button>
        <button type="button" data-screen="budget">Бюджет</button>
        <button type="button" data-screen="sync">Облако</button>
      </nav>
      <div class="sk-side-foot">
        <span class="sk-pill" id="sync-badge">облако</span>
      </div>
    </aside>

    <div class="sk-shell">
      <header class="sk-top">
        <div class="sk-top-text">
          <p class="sk-top-eyebrow">Богданиха</p>
          <h1 class="sk-brand" id="page-title">Сегодня</h1>
          <p class="sk-lead" id="page-lead">Что едим, что готово, чего не хватает.</p>
        </div>
        <span class="sk-pill sk-pill-mobile" id="sync-badge-mobile">облако</span>
      </header>

      <main>
        <section class="sk-panel active" id="screen-today"></section>
        <section class="sk-panel" id="screen-plan"></section>
        <section class="sk-panel" id="screen-period"></section>
        <section class="sk-panel" id="screen-inventory"></section>
        <section class="sk-panel" id="screen-basket"></section>
        <section class="sk-panel" id="screen-recipes"></section>
        <section class="sk-panel" id="screen-stats"></section>
        <section class="sk-panel" id="screen-budget"></section>
        <section class="sk-panel" id="screen-sync"></section>
      </main>
    </div>
  </div>

  <div class="sk-modal" id="recipeModal" role="dialog" aria-modal="true">
    <div class="sk-modal-card">
      <button type="button" class="sk-btn sk-btn-ghost sk-modal-close" id="modal-close">Закрыть</button>
      <h2 class="sk-brand" style="font-size:1.45rem;margin-bottom:8px" id="recipeModalTitle">Рецепт</h2>
      <div id="recipeModalBody"></div>
    </div>
  </div>
  <div class="sk-modal" id="productModal" role="dialog" aria-modal="true">
    <div class="sk-modal-card">
      <button type="button" class="sk-btn sk-btn-ghost sk-modal-close" id="product-modal-close">Закрыть</button>
      <h2 class="sk-brand" style="font-size:1.35rem;margin-bottom:8px" id="productModalTitle">Продукт</h2>
      <div id="productModalBody"></div>
    </div>
  </div>
  <div class="sk-modal" id="dayModal" role="dialog" aria-modal="true">
    <div class="sk-modal-card">
      <button type="button" class="sk-btn sk-btn-ghost sk-modal-close" id="day-modal-close">Закрыть</button>
      <h2 class="sk-brand" style="font-size:1.35rem;margin-bottom:8px" id="dayModalTitle">День</h2>
      <div id="dayModalBody"></div>
    </div>
  </div>
  <div class="sk-modal" id="cookModal" role="dialog" aria-modal="true">
    <div class="sk-modal-card">
      <button type="button" class="sk-btn sk-btn-ghost sk-modal-close" id="cook-modal-close">Закрыть</button>
      <h2 class="sk-brand" style="font-size:1.35rem;margin-bottom:8px" id="cookModalTitle">Списание запасов</h2>
      <div id="cookModalBody"></div>
    </div>
  </div>
  <nav class="sk-tabbar" id="tabbar" aria-label="Главное меню">
    <button type="button" data-screen="today" class="active">Сегодня</button>
    <button type="button" data-screen="plan">План</button>
    <button type="button" data-screen="inventory">Запасы</button>
    <button type="button" data-screen="basket">Покупки</button>
    <button type="button" data-more>Ещё</button>
  </nav>

  <div class="sk-more" id="more-sheet" hidden>
    <button type="button" class="sk-more-backdrop" data-close-more aria-label="Закрыть"></button>
    <div class="sk-more-card" role="dialog" aria-label="Другие разделы">
      <div class="sk-more-handle"></div>
      <p class="sk-more-title">Ещё</p>
      <button type="button" data-screen="period">Период</button>
      <button type="button" data-screen="recipes">Рецепты</button>
      <button type="button" data-screen="stats">Статистика</button>
      <button type="button" data-screen="budget">Бюджет</button>
      <button type="button" data-screen="sync">Облако</button>
      <button type="button" class="sk-btn sk-btn-ghost sk-btn-block" data-close-more style="margin-top:8px">Закрыть</button>
    </div>
  </div>

  <div class="sk-toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <script src="data/app-data.js"></script>
  <script type="module" src="app/js/app.js"></script>
</body>
</html>
