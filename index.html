<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#234e3a" />
  <title>Семейная кухня</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Manrope:wght@500;650;750&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app/css/app.css" />
</head>
<body class="profile-kitchen">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>Семейная кухня</h1>
        <p>Запасы → меню → корзина → готовка → деньги. Богданиха · Ашан · Пятёрочка · Парное мясо.</p>
      </div>
      <div class="profile-switch" role="group" aria-label="Профиль">
        <button type="button" data-profile="kitchen" class="active">Кухня</button>
        <button type="button" data-profile="command">Командный</button>
      </div>
    </header>

    <nav class="nav" aria-label="Разделы">
      <button type="button" data-screen="today" class="active">Сегодня</button>
      <button type="button" data-screen="plan">План</button>
      <button type="button" data-screen="inventory">Запасы</button>
      <button type="button" data-screen="basket">Корзина</button>
      <button type="button" data-screen="recipes">Рецепты</button>
      <button type="button" data-screen="budget" data-cmd-only>Бюджет</button>
      <button type="button" data-screen="family" data-cmd-only>Семья</button>
    </nav>

    <main>
      <section class="panel active" id="screen-today"></section>
      <section class="panel" id="screen-plan"></section>
      <section class="panel" id="screen-inventory"></section>
      <section class="panel" id="screen-basket"></section>
      <section class="panel" id="screen-recipes"></section>
      <section class="panel" id="screen-budget"></section>
      <section class="panel" id="screen-family"></section>
    </main>

    <p class="footer-hint">Данные хранятся в браузере (IndexedDB). Экспорт — в разделе «Семья».</p>
  </div>

  <div class="modal" id="modal">
    <div class="card modal-card">
      <button type="button" class="btn btn-ghost" id="modal-close" style="position:absolute;right:12px;top:12px">Закрыть</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="data/app-data.js"></script>
  <script type="module" src="app/js/app.js"></script>
</body>
</html>
