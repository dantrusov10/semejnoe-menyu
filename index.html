<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3a56" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1f3a56" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Кухня" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>Семейная кухня</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;650;750&family=Syne:wght@700;750&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet" />
  <link href="app/css/app.css?v=13" rel="stylesheet" />
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body>
  <button type="button" class="sk-drawer-backdrop" id="drawer-backdrop" hidden aria-label="Закрыть меню"></button>
  <div class="sk-layout">
    <aside class="sk-side" id="side-nav" aria-label="Навигация">
      <div class="sk-side-brand">
        <span>Богданиха</span>
        Семейная кухня
      </div>
      <nav class="sk-side-nav" id="nav-list" aria-label="Разделы">
        <p class="sk-nav-group">Еда</p>
        <button type="button" data-screen="today" class="active">Сегодня</button>
        <button type="button" data-screen="plan">Меню</button>
        <button type="button" data-screen="period">Сборка</button>
        <button type="button" data-screen="recipes">Рецепты</button>
        <p class="sk-nav-group">Запасы и покупки</p>
        <button type="button" data-screen="inventory">Запасы</button>
        <button type="button" data-screen="basket">Покупки</button>
        <p class="sk-nav-group">Дом</p>
        <button type="button" data-screen="budget">Бюджет</button>
        <button type="button" data-screen="stats">Статистика</button>
        <button type="button" data-screen="sync">Облако</button>
      </nav>
      <div class="sk-side-foot">
        <span class="sk-pill" id="sync-badge">облако</span>
        <button type="button" class="sk-btn sk-btn-ghost sk-btn-block sk-drawer-close" id="drawer-close" hidden>Закрыть</button>
      </div>
    </aside>

    <div class="sk-shell">
      <header class="sk-top">
        <button type="button" class="sk-menu-btn" id="menu-btn" aria-label="Открыть меню" aria-controls="side-nav" aria-expanded="false">
          <span class="sk-menu-btn-bars" aria-hidden="true"></span>
        </button>
        <div class="sk-top-text">
          <p class="sk-top-eyebrow">Богданиха</p>
          <h1 class="sk-brand" id="page-title">Сегодня</h1>
          <p class="sk-lead" id="page-lead">Что едим, что готово, чего не хватает.</p>
        </div>
        <span class="sk-pill sk-pill-mobile" id="sync-badge-mobile">облако</span>
      </header>

      <main>
        <section class="sk-panel active" id="screen-today"></section>
        <section class="sk-panel" id="screen-plan"></section>
        <section class="sk-panel" id="screen-period"></section>
        <section class="sk-panel" id="screen-inventory"></section>
        <section class="sk-panel" id="screen-basket"></section>
        <section class="sk-panel" id="screen-recipes"></section>
        <section class="sk-panel" id="screen-stats"></section>
        <section class="sk-panel" id="screen-budget"></section>
        <section class="sk-panel" id="screen-sync"></section>
      </main>
    </div>
  </div>

  <div class="sk-modal" id="recipeModal" role="dialog" aria-modal="true" aria-labelledby="recipeModalTitle">
    <div class="sk-modal-card">
      <button type="button" class="sk-btn sk-btn-ghost sk-modal-close" id="modal-close" aria-label="Закрыть рецепт">Закрыть</button>
      <h2 class="sk-brand" style="font-size:1.45rem;margin-bottom:8px" id="recipeModalTitle">Рецепт</h2>
      <div id="recipeModalBody"></div>
    </div>
  </div>
  <div class="sk-modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
    <div class="sk-modal-card">
      <button type="button" class="sk-btn sk-btn-ghost sk-modal-close" id="product-modal-close" aria-label="Закрыть">Закрыть</button>
      <h2 class="sk-brand" style="font-size:1.35rem;margin-bottom:8px" id="productModalTitle">Продукт</h2>
      <div id="productModalBody"></div>
    </div>
  </div>
  <div class="sk-modal" id="dayModal" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle">
    <div class="sk-modal-card">
      <button type="button" class="sk-btn sk-btn-ghost sk-modal-close" id="day-modal-close" aria-label="Закрыть">Закрыть</button>
      <h2 class="sk-brand" style="font-size:1.35rem;margin-bottom:8px" id="dayModalTitle">День</h2>
      <div id="dayModalBody"></div>
    </div>
  </div>
  <div class="sk-modal" id="cookModal" role="dialog" aria-modal="true" aria-labelledby="cookModalTitle">
    <div class="sk-modal-card">
      <button type="button" class="sk-btn sk-btn-ghost sk-modal-close" id="cook-modal-close" aria-label="Закрыть">Закрыть</button>
      <h2 class="sk-brand" style="font-size:1.35rem;margin-bottom:8px" id="cookModalTitle">Списание запасов</h2>
      <div id="cookModalBody"></div>
    </div>
  </div>
  <nav class="sk-tabbar" id="tabbar" aria-label="Главное меню">
    <button type="button" data-screen="today" class="active"><span class="sk-tab-ico" aria-hidden="true">◉</span><span>Сегодня</span></button>
    <button type="button" data-screen="plan"><span class="sk-tab-ico" aria-hidden="true">☰</span><span>Меню</span></button>
    <button type="button" data-screen="inventory"><span class="sk-tab-ico" aria-hidden="true">▣</span><span>Запасы</span></button>
    <button type="button" data-screen="basket"><span class="sk-tab-ico" aria-hidden="true">🛒</span><span>Покупки</span></button>
    <button type="button" data-more aria-label="Открыть все разделы"><span class="sk-tab-ico" aria-hidden="true">⋯</span><span>Ещё</span></button>
  </nav>

  <div class="sk-toast" id="toast" role="status"></div>
  <div class="sk-update" id="update-banner" hidden>
    <span>Доступно обновление</span>
    <button type="button" class="sk-btn sk-btn-accent" id="update-reload">Обновить</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <script src="data/app-data.js"></script>
  <script type="module" src="app/js/app.js?v=13"></script>
</body>
</html>
